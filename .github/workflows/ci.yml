name: CI

# PHASE 0 pipeline: lint, format, types, unit tests, and a real `docker compose`
# smoke test that runs the PHASE 0 Definition of Done script.
#
# PHASE 9 extends this file with security scanning, image builds published to
# GHCR, migration jobs and deployment. Do not add those here early.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install
        run: pip install -e "apps/api[dev]"

      - name: Lint
        run: ruff check apps/api apps/worker

      - name: Format
        run: ruff format --check apps/api apps/worker

      - name: Types
        run: mypy
        working-directory: apps/api

      - name: Unit tests
        run: pytest
        working-directory: apps/api

  frontend:
    name: Frontend (prettier, eslint, tsc, vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Format
        run: npx prettier --check .

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Unit and component tests
        run: npm test

  stack:
    name: Stack (docker compose + PHASE 0 Definition of Done)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install (Playwright runner lives in the workspace)
        run: npm ci

      - name: Create .env
        run: cp .env.example .env

      - name: Build images
        run: docker compose build

      - name: Verify the PHASE 0 Definition of Done
        run: ./scripts/dev/verify-phase-0.sh

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests against the running stack
        run: E2E_BASE_URL=http://localhost:3100 npm run test:e2e --workspace=web

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose down -v
